<header class="app-header">
  <div class="header-top">
    <!-- Logotipo y Nombre de la Aplicación -->
    <div class="brand">
      <div class="ig-logo-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </div>
      <div class="brand-text">
        <div class="title-row">
          <span class="title">¿Quién me dejó de seguir?</span>
          @if (scanner.isMockMode()) {
            <span class="mock-pill" (click)="openSettings.emit()" title="Modo de Prueba activo (Mock Data). Haz clic para abrir ajustes.">🧪 Modo Prueba</span>
          }
        </div>
        <span class="subtitle">Instagram Unfollowers</span>
      </div>
    </div>

    <!-- Botones de Acción Superiores -->
    <div class="header-actions">
      <!-- Alternar Tema: Claro / Oscuro -->
      <button
        class="icon-btn theme-toggle-btn"
        [title]="themeService.currentTheme() === 'dark' ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'"
        (click)="themeService.toggleTheme()"
      >
        @if (themeService.currentTheme() === 'dark') {
          <!-- Icono de Sol para pasar a Claro -->
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <!-- Icono de Luna para pasar a Oscuro -->
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <!-- Abrir Modal de Información & Bienvenida -->
      <button
        class="icon-btn info-btn"
        title="Guía de seguridad y bienvenida"
        (click)="openWelcome.emit()"
      >
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </button>

      <!-- Exportar a CSV (deshabilitado si no hay resultados) -->
      <button
        class="icon-btn export-btn"
        title="Exportar a CSV"
        (click)="scanner.exportUnfollowersCsv()"
        [disabled]="scanner.displayedUsers().length === 0"
      >
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>

      <!-- Abrir Modal de Ajustes y Lista Blanca -->
      <button
        class="icon-btn settings-btn"
        title="Ajustes de seguridad y Lista Blanca"
        (click)="openSettings.emit()"
      >
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <!-- Botón para cerrar el panel lateral deslizable -->
      <button
        class="icon-btn close-btn"
        title="Cerrar panel"
        (click)="closeDrawer()"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Buscador en tiempo real con diseño Instagram -->
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      type="text"
      placeholder="Buscar por usuario o nombre..."
      [ngModel]="scanner.searchTerm()"
      (ngModelChange)="scanner.searchTerm.set($event)"
      [disabled]="scanner.status() === 'initial'"
    />
    @if (scanner.searchTerm()) {
      <button
        class="clear-search"
        (click)="scanner.searchTerm.set('')"
        title="Limpiar búsqueda"
      >
        ✕
      </button>
    }
  </div>
</header>
